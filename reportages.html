    transition:opacity var(--dur-text) var(--ease-reveal),transform var(--dur-text) var(--ease-reveal)}

const PLAY = '<span class="play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';
const esc = s => (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function cover(ep){
  if(ep.image){
    return '<div class="cover skel"><span class="tag">'+esc(ep.show)+'</span>'+
      '<img class="rc-img" src="'+esc(ep.image)+'" alt="'+esc(ep.title)+'" decoding="async" loading="lazy" referrerpolicy="no-referrer">'+
      '<span class="pin play"><svg viewBox=\'0 0 24 24\' fill=\'currentColor\'><path d=\'M8 5v14l11-7z\'/></svg></span></div>';
  }
  return '<div class="cover"><span class="tag">'+esc(ep.show)+'</span>'+
    '<div class="fb"><span>'+esc(ep.title)+'</span></div>'+
    '<span class="pin play"><svg viewBox=\'0 0 24 24\' fill=\'currentColor\'><path d=\'M8 5v14l11-7z\'/></svg></span></div>';
}
function card(ep){
  var also = (ep.companions&&ep.companions.length)?'<span class="also">+ '+ep.companions.length+' à écouter aussi</span>':'';
  return '<a class="ep" data-show="'+esc(ep.showKey)+'" data-country="'+esc(ep.country||'')+'" href="'+esc(ep.url)+'" target="_blank" rel="noopener">'+
    cover(ep)+
    '<div class="body">'+
      '<div class="loc"><span>'+esc(ep.place||ep.show)+'</span><span class="d">'+esc(ep.date)+'</span></div>'+
      '<h4>'+esc(ep.title)+'</h4>'+
      (ep.blurb?'<p>'+esc(ep.blurb)+'</p>':'')+
      also+
      '<span class="listen">'+PLAY+'Écouter<span class="ar">→</span></span>'+
    '</div></a>';
}
function head(ep){
  return '<a class="card" href="'+esc(ep.url)+'" target="_blank" rel="noopener">'+
    '<div class="ph'+(ep.image?' skel':'')+'">'+(ep.image?'<img class="rc-img" src="'+esc(ep.image)+'" alt="'+esc(ep.title)+'" referrerpolicy="no-referrer">':'')+'</div>'+
    '<div class="txt"><span class="flag"><span class="dot"></span>Dernier reportage</span>'+
    '<div class="tags"><span class="s">'+esc(ep.show)+'</span><span class="p">'+esc(ep.place||"")+'</span><span class="p">'+esc(ep.date)+'</span></div>'+
    '<h2>'+esc(ep.title)+'</h2>'+(ep.blurb?'<p>'+esc(ep.blurb)+'</p>':'')+
    '<span class="go">'+PLAY+'Écouter sur RFI</span></div></a>';
}

function activeVal(container, attr){ var b=container&&container.querySelector('button.active'); return b?b.getAttribute(attr):'all'; }
function refresh(){
  var curShow=activeVal(document.getElementById('filters'),'data-f');
  var curCountry=activeVal(document.getElementById('filters-loc'),'data-c');
  var cards=[].slice.call(document.querySelectorAll('#eps .ep'));
  var n=0; cards.forEach(function(c){
    var ok=(curShow==='all'||c.getAttribute('data-show')===curShow) &&
           (curCountry==='all'||c.getAttribute('data-country')===curCountry);
    c.style.display=ok?'':'none'; if(ok)n++;
  });
  var count=document.getElementById('count'); if(count) count.textContent=n+(n>1?' épisodes':' épisode');
}
function render(data){
  const eps = (data.episodes||[]).slice().sort((a,b)=>(a.sort<b.sort?1:(a.sort>b.sort?-1:0)));
  const list = eps.length?eps:SEED.episodes;
  document.getElementById('latest').innerHTML = head(list[0]);
  const box = document.getElementById('eps');
  box.innerHTML = list.map(card).join('');
  var latest = document.getElementById('latest');
  if(latest.firstElementChild) latest.firstElementChild.classList.add('reveal','reveal-blur');
  if(window.revealScan){ window.revealScan(document.getElementById('latest'));
                         window.revealScan(document.getElementById('eps').parentNode); }
  // Reveal the grid cards with the per-card lazy stagger (reliable on a tall grid,
  // unlike the whole-grid reveal which never hit its threshold). Same effect as "Ses modules".
  if(window.rcStagger) window.rcStagger(document.querySelectorAll('#eps .ep'));
  // build filter chips from the data (émission + lieu)
  var shows=[]; list.forEach(function(e){ if(e.showKey && !shows.some(function(s){return s.key===e.showKey;})) shows.push({key:e.showKey,label:e.show}); });
  var countries=[]; list.forEach(function(e){ if(e.country && countries.indexOf(e.country)<0) countries.push(e.country); });
  countries.sort(function(a,b){return a.localeCompare(b,'fr');});
  var fShow=document.getElementById('filters');
  fShow.innerHTML='<button class="active" data-f="all">Tous</button>'+shows.map(function(s){return '<button data-f="'+esc(s.key)+'">'+esc(s.label)+'</button>';}).join('');
  var fLoc=document.getElementById('filters-loc');
  if(countries.length>=2){
    fLoc.style.display='';
    fLoc.innerHTML='<span class="filters-lbl">Lieu —</span><button class="active" data-c="all">Partout</button>'+countries.map(function(c){return '<button data-c="'+esc(c)+'">'+esc(c)+'</button>';}).join('');
  } else { fLoc.style.display='none'; fLoc.innerHTML=''; }
  refresh();
  document.getElementById('note').innerHTML = 'Mise à jour automatique depuis RFI. <a href="https://www.rfi.fr/fr/auteur/rapha%C3%ABlle-constant/" target="_blank" rel="noopener">Toute son œuvre sur RFI →</a>';
  if(data.updated) document.getElementById('updated').textContent = 'Mis à jour le '+data.updated;
}

// Wire filter clicks once (delegation; reads fresh state on each click).
document.getElementById('filters').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); refresh(); });
document.getElementById('filters-loc').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return;
  this.querySelectorAll('button').forEach(function(x){x.classList.remove('active');}); b.classList.add('active'); refresh(); });

// Render seed immediately, then upgrade to the live episodes.json if available.
render(SEED);
fetch('episodes.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.episodes&&d.episodes.length) render(d); }).catch(()=>{});
</script>
<!-- Lenis smooth scroll -->
<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || typeof Lenis === 'undefined') return;
  var lenis = new Lenis({ duration:1.1,
    easing:function(t){ return Math.min(1, 1.001 - Math.pow(2,-10*t)); },
    smoothWheel:true, wheelMultiplier:1, touchMultiplier:1.6 });
  window.lenis = lenis;
  function raf(time){ lenis.raf(time); requestAnimationFrame(raf); }
  requestAnimationFrame(raf);
})();
</script>
<!-- Reveal engine (exposes window.revealScan for re-scanning JS-rendered cards) -->
<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var io = reduce ? null : new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(!e.isIntersecting) return;
      e.target.classList.add('is-revealed'); io.unobserve(e.target);
    });
  }, { threshold:0.2, rootMargin:'0px 0px -8% 0px' });

  function buildEq(root){
    root.querySelectorAll('.eq').forEach(function(eq){
      if(eq.childElementCount) return;
      var h=''; for(var j=0;j<7;j++) h+='<i style="animation-delay:'+(j*55)+'ms"></i>';
      eq.innerHTML=h;
    });
  }
  function splitHeadline(el){
    if(el.dataset._split) return; el.dataset._split='1';
    function wrap(node){ var w=document.createElement('span'); w.className='w';
      var i=document.createElement('span'); i.className='i'; i.appendChild(node);
      w.appendChild(i); return w; }
    var frag=document.createDocumentFragment();
    [].slice.call(el.childNodes).forEach(function(node){
      if(node.nodeType===3){
        node.textContent.split(/(\s+)/).forEach(function(p){
          if(p==='') return;
          if(/^\s+$/.test(p)) frag.appendChild(document.createTextNode(' '));
          else frag.appendChild(wrap(document.createTextNode(p)));
        });
      } else if(node.nodeName==='BR'){ frag.appendChild(document.createElement('br')); }
      else { frag.appendChild(wrap(node.cloneNode(true))); }
    });
    el.innerHTML=''; el.appendChild(frag);
    [].slice.call(el.querySelectorAll('.i')).forEach(function(i,idx){ i.style.animationDelay=(idx*80)+'ms'; });
  }
  window.revealScan = function(root){
    root = root || document;
    buildEq(root);
    root.querySelectorAll('.reveal-headline').forEach(splitHeadline);
    root.querySelectorAll('.reveal-grid').forEach(function(grid){
      [].slice.call(grid.children).forEach(function(c,i){ c.style.setProperty('--i', Math.min(i,7)); });
    });
    var els=[].slice.call(root.querySelectorAll('.reveal, .reveal-grid, .eq-label'))
              .filter(function(el){ return !el.classList.contains('is-revealed'); });
    if(reduce){ els.forEach(function(el){ el.classList.add('is-revealed'); }); return; }
    els.forEach(function(el){ io.observe(el); });
  };
  document.addEventListener('DOMContentLoaded', function(){ window.revealScan(document); });
})();
</script>
